[workspace]
resolver = "2"
members = [".", "vendor/pocket-gles"]

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/j92580498-max/PocketHLE"
authors = ["PocketHLE Contributors"]

[workspace.dependencies]
log = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "p2d-gles-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pocket-gles = { path = "vendor/pocket-gles" }
serde = { workspace = true }
serde_json = { workspace = true }

[profile.release]
lto = "thin"
codegen-units = 1

